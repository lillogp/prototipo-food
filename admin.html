<style>
:root {
  color-scheme: light;
  --bg: #F4F7E8; --surface: #FFFFFF; --fg: #222B16; --muted: #626E50; --line: #E2E8CC;
  --accent: #45802A; --accent-fg: #FFFFFF; --soft: #E8F1D2; --ok: #1F7A4D; --okbg: #E4F4EA; --bad: #B3261E; --badbg: #FDE8E6; --warn: #8A5A00; --warnbg: #FFF1D6;
  --f-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --f-body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.45; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; line-height: 1.15; }
h2 { font-size: 22px; } h3 { font-size: 16px; }
.btn { background: var(--accent); color: var(--accent-fg); font-weight: 600; border-radius: 11px; padding: 10px 16px; white-space: nowrap; }
.btn.ghost { background: var(--soft); color: var(--fg); }
.btn.sm { padding: 7px 12px; font-size: 14px; border-radius: 10px; }
.btn.danger { background: var(--badbg); color: var(--bad); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
input[type=email], input[type=password], input[type=search], select { font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 11px; padding: 10px 12px; width: 100%; }
select { width: auto; }
label.f { display: flex; flex-direction: column; gap: 6px; font-weight: 600; font-size: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
.msg { margin: 0; font-size: 14px; color: var(--muted); } .msg.err { color: var(--bad); }
.login { max-width: 380px; margin: 60px auto 0; display: flex; flex-direction: column; gap: 14px; }
.chip { display: inline-block; font-size: 12px; font-weight: 600; border-radius: 99px; padding: 2px 10px; background: var(--soft); color: var(--muted); white-space: nowrap; }
.chip.ok { background: var(--okbg); color: var(--ok); } .chip.bad { background: var(--badbg); color: var(--bad); } .chip.warn { background: var(--warnbg); color: var(--warn); }
.empty { border: 1px dashed var(--line); border-radius: 16px; padding: 28px 18px; text-align: center; color: var(--muted); background: var(--surface); }
.empty b { display: block; color: var(--fg); font-family: var(--f-display); font-size: 18px; margin-bottom: 4px; }
.note { background: var(--soft); border-radius: 12px; padding: 10px 12px; font-size: 14px; color: var(--muted); margin-bottom: 14px; }
.acts { display: flex; gap: 8px; flex-wrap: wrap; }
.ver { text-align: center; font-size: 12px; color: var(--muted); margin: 26px 0 0; opacity: .8; }
.muted { color: var(--muted); } small.muted { font-size: 13px; }

/* shell */
.shell { display: grid; grid-template-columns: 230px 1fr; min-height: 100vh; }
.side { background: var(--surface); border-right: 1px solid var(--line); padding: 18px 12px; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 4px; }
.logo { display: flex; align-items: center; gap: 10px; font-family: var(--f-display); font-weight: 700; font-size: 24px; letter-spacing: -0.02em; padding: 0 10px 14px; }
.logo .lg { width: 34px; height: 34px; flex: none; }
.logo .lt { display: flex; flex-direction: column; line-height: 1.05; }
.logo small { display: block; font-family: var(--f-body); font-weight: 500; font-size: 12px; color: var(--muted); letter-spacing: 0; }
.ib .ico { display: none; width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav button { display: flex; align-items: center; gap: 10px; text-align: left; padding: 9px 10px; border-radius: 10px; font-weight: 600; color: var(--muted); }
.nav button svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.nav button:hover { background: var(--bg); }
.nav button[aria-current="page"] { background: var(--soft); color: var(--fg); }
.nav .badge { margin-left: auto; background: var(--bad); color: #fff; font-size: 12px; border-radius: 99px; padding: 0 7px; min-width: 20px; text-align: center; }
.side .me { margin-top: auto; padding: 10px; font-size: 13px; color: var(--muted); overflow-wrap: anywhere; display: flex; flex-direction: column; gap: 8px; }
.main { padding: 22px clamp(14px, 3vw, 34px) 70px; min-width: 0; max-width: 1240px; width: 100%; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.top .sub { font-size: 13px; color: var(--muted); }

/* KPI */
.kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; margin-bottom: 18px; }
.kpi { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; transition: border-color .15s, transform .15s; position: relative; }
.kpi:hover { border-color: var(--accent); transform: translateY(-1px); }
.kpi .kl { font-size: 13px; font-weight: 600; color: var(--muted); }
.kpi b { font-family: var(--f-display); font-size: 32px; line-height: 1.1; }
.kpi small { font-size: 13px; color: var(--muted); }
.kpi small i { font-style: normal; font-weight: 700; } .up { color: var(--ok); } .down { color: var(--bad); } .flat { color: var(--muted); }
.kpi.alert { border-color: var(--bad); background: #FFF8F7; }
.kpi .go { position: absolute; top: 12px; right: 14px; width: 16px; height: 16px; stroke: var(--muted); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.bar { height: 7px; border-radius: 99px; background: var(--soft); overflow: hidden; margin: 6px 0 2px; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.bar.hot > i { background: var(--bad); } .bar.mid > i { background: #D9A100; }

.grid2 { display: grid; grid-template-columns: 1.6fr 1fr; gap: 14px; margin-bottom: 14px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; min-width: 0; }
.panel h3 { margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.tabs { display: inline-flex; background: var(--soft); border-radius: 10px; padding: 3px; gap: 3px; }
.tabs button { padding: 5px 11px; border-radius: 8px; font-weight: 600; font-size: 13px; color: var(--muted); }
.tabs button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgba(40, 40, 10, .12); }
.chart { width: 100%; height: auto; display: block; }
.chart rect { fill: var(--accent); } .chart rect:hover { fill: #2f5f1b; }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--f-body); }
.chart line { stroke: var(--line); }
.lst { display: flex; flex-direction: column; }
.li { display: flex; align-items: center; gap: 10px; padding: 9px 4px; border-top: 1px solid var(--line); text-align: left; width: 100%; border-radius: 8px; }
.li:first-child { border-top: 0; }
button.li:hover { background: var(--bg); }
.li .t { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.li .t b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.li .t span { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.li .r { font-size: 13px; color: var(--muted); white-space: nowrap; }
.thumb { width: 44px; height: 44px; border-radius: 10px; object-fit: cover; background: var(--soft); flex: none; }
.av { width: 38px; height: 38px; border-radius: 50%; background: var(--soft); color: var(--accent); display: grid; place-items: center; font-weight: 700; flex: none; object-fit: cover; font-family: var(--f-display); }
.av.lg { width: 64px; height: 64px; font-size: 24px; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); flex: none; } .dot.r { background: var(--bad); } .dot.b { background: #3B7DD8; }

/* toolbar + lists */
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.toolbar .grow { flex: 1 1 240px; }
.pills { display: flex; gap: 6px; flex-wrap: wrap; }
.pill { padding: 6px 12px; border-radius: 99px; background: var(--surface); border: 1px solid var(--line); font-weight: 600; font-size: 13px; color: var(--muted); }
.pill[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.tbl { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.tr { display: grid; grid-template-columns: minmax(180px, 2.2fr) minmax(160px, 2fr) 130px 70px 110px; gap: 12px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--line); width: 100%; text-align: left; }
.tr.th { border-top: 0; background: var(--bg); font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; padding-top: 8px; padding-bottom: 8px; }
button.tr:hover { background: var(--bg); }
.tr .who { display: flex; gap: 10px; align-items: center; min-width: 0; }
.tr .who span { min-width: 0; display: flex; flex-direction: column; }
.tr .who b, .tr .em { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tr .em { color: var(--muted); font-size: 14px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; text-align: left; display: flex; flex-direction: column; transition: border-color .15s; }
.tile:hover { border-color: var(--accent); }
.tile img { width: 100%; aspect-ratio: 1; object-fit: cover; background: var(--soft); display: block; }
.tile.story img { aspect-ratio: 9/14; }
.tile .tb { padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; }
.tile .tb b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tile .tb span { font-size: 13px; color: var(--muted); }
.rep { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: space-between; }
.rep .info { flex: 1 1 280px; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.rep .info span { color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.more { display: block; margin: 16px auto 0; }

/* drawer */
.dov { position: fixed; inset: 0; background: rgba(20, 26, 10, .45); z-index: 30; display: flex; justify-content: flex-end; animation: fade .15s; }
.drawer { background: var(--bg); width: min(560px, 100%); height: 100%; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; animation: slide .2s; }
@keyframes slide { from { transform: translateX(40px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.dh { display: flex; gap: 12px; align-items: center; }
.dh .t { flex: 1; min-width: 0; } .dh .t h2 { overflow-wrap: anywhere; }
.x { width: 36px; height: 36px; border-radius: 50%; background: var(--surface); border: 1px solid var(--line); display: grid; place-items: center; flex: none; }
.x svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; }
.facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.fact { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px; }
.fact b { display: block; font-family: var(--f-display); font-size: 21px; } .fact span { font-size: 12px; color: var(--muted); }
.kv { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.kv > div { display: flex; justify-content: space-between; gap: 12px; padding: 9px 14px; border-top: 1px solid var(--line); font-size: 14px; }
.kv > div:first-child { border-top: 0; } .kv > div span:first-child { color: var(--muted); } .kv > div span:last-child { text-align: right; overflow-wrap: anywhere; font-weight: 500; }
.hero { width: 100%; max-height: 340px; object-fit: cover; border-radius: 14px; background: var(--soft); }
ol.steps, ul.ings { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.bg { position: fixed; inset: 0; background: rgba(20, 12, 8, .55); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 40; }
.dlg { background: var(--bg); border-radius: 18px; padding: 20px; max-width: 520px; width: 100%; max-height: 88vh; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
.dlg img.big { width: 100%; max-height: 62vh; object-fit: contain; border-radius: 12px; background: #000; }
.chat { display: flex; flex-direction: column; gap: 8px; }
.m { max-width: 85%; border-radius: 14px; padding: 8px 12px; background: var(--soft); align-self: flex-start; }
.m.rp { background: var(--badbg); align-self: flex-end; }
.m small { display: block; font-size: 12px; color: var(--muted); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: 20px; background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 99px; font-size: 14px; z-index: 60; }
.skel { background: linear-gradient(90deg, var(--soft), #F3F7E6, var(--soft)); background-size: 200% 100%; animation: sk 1.2s infinite; border-radius: 12px; height: 64px; }
@keyframes sk { to { background-position: -200% 0; } }

.bnav { display: none; }
@media (max-width: 900px), (hover: none) and (pointer: coarse) {
  .shell { grid-template-columns: 1fr; grid-template-rows: auto 1fr; min-height: 100dvh; }
  .side { position: sticky; top: 0; z-index: 20; height: auto; align-self: start; flex-direction: row; align-items: center; padding: 10px 14px; padding-top: calc(10px + env(safe-area-inset-top)); gap: 8px; border: 0; background: #222B16; color: #fff; box-shadow: 0 2px 10px rgba(20, 26, 10, .25); }
  .logo { padding: 0; font-size: 22px; color: #fff; } .logo .lg { width: 32px; height: 32px; }
  .logo small { display: block; font-size: 11px; color: #B9C79B; letter-spacing: .06em; text-transform: uppercase; margin-top: 2px; }
  .side .me .btn { background: rgba(255, 255, 255, .14); color: #fff; }
  .ib { width: 42px; height: 42px; padding: 0; border-radius: 50%; display: grid; place-items: center; } .ib .ico { display: block; } .ib .lbl { display: none; }
  .side .nav { display: none; }
  .side .me { margin: 0 0 0 auto; flex-direction: row; align-items: center; padding: 0; } .side .me .em { display: none; }
  .main { padding: 14px 14px calc(88px + env(safe-area-inset-bottom)); }
  .top h2 { font-size: 20px; }
  .bnav { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--surface); border-top: 1px solid var(--line); padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); }
  .bnav button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; border-radius: 10px; font-size: 11px; font-weight: 600; color: var(--muted); position: relative; min-width: 0; }
  .bnav button svg { width: 23px; height: 23px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .bnav button[aria-current="page"] { color: var(--accent); background: var(--soft); }
  .bnav .badge { position: absolute; top: 1px; left: 55%; background: var(--bad); color: #fff; font-size: 10px; border-radius: 99px; padding: 0 5px; min-width: 16px; text-align: center; }
  .grid2, .grid2[style] { grid-template-columns: 1fr !important; }
  .tr { grid-template-columns: 1fr auto; } .tr.th, .tr .em, .tr .c3, .tr .c4 { display: none; }
  .drawer { width: 100%; padding: 16px; padding-top: calc(16px + env(safe-area-inset-top)); padding-bottom: calc(24px + env(safe-area-inset-bottom)); }
  .toast { bottom: calc(80px + env(safe-area-inset-bottom)); }
  .kpis { grid-template-columns: 1fr 1fr; gap: 10px; } .kpi { padding: 12px; } .kpi b { font-size: 26px; }
  .facts { grid-template-columns: repeat(2, 1fr); }
  .btn.sm, .pill { padding-top: 9px; padding-bottom: 9px; }
}
@media (max-width: 520px) { .kpi small { font-size: 12px; } }
</style>
