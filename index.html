<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Gusto</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=DM+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: colonna unica mobile-first, header in alto, barra di navigazione fissa in basso, schede e sheet per la ricetta. */
:root {
  color-scheme: light;
  --bg: #FFF9F2;
  --surface: #FFFFFF;
  --fg: #2B2320;
  --muted: #6F625B;
  --line: #F0E4D8;
  --accent: #DE4A1E;
  --accent-fg: #FFFFFF;
  --hot: #E5365B;
  --soft: #FFEBDD;
  --f-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --f-body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 96px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
.col { max-width: 520px; margin: 0 auto; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible, input:focus-visible, textarea:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; line-height: 1.15; text-wrap: balance; }

header.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg);
  display: flex; align-items: center; justify-content: space-between; padding-block: 12px;
}
.logo { font-family: var(--f-display); font-weight: 700; font-size: 26px; letter-spacing: -0.02em; line-height: 1; }
.logo .lo { width: .74em; height: .74em; vertical-align: -.07em; margin-left: .04em; color: var(--accent); }
.chip { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 99px; padding: 3px 10px; }

.note { background: var(--soft); border-radius: 12px; padding: 10px 12px; font-size: 13px; color: var(--muted); display: flex; gap: 10px; justify-content: space-between; align-items: flex-start; margin-bottom: 14px; }
.note button { color: var(--accent); font-weight: 600; white-space: nowrap; }

.filters { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 12px; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.filters button { flex: none; border: 1px solid var(--line); border-radius: 99px; padding: 6px 14px; font-size: 14px; background: var(--surface); }
.filters button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }

.feed { display: flex; flex-direction: column; gap: 22px; }
.post { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
.post-h { display: flex; align-items: center; gap: 10px; padding: 12px 14px; }
.av { width: 36px; height: 36px; border-radius: 50%; background: var(--accent); color: var(--accent-fg); display: grid; place-items: center; font-family: var(--f-display); font-weight: 700; flex: none; }
.who { min-width: 0; flex: 1; }
.who b { display: block; font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.who span { font-size: 12px; color: var(--muted); }
.role { font-size: 11px; font-weight: 600; color: var(--accent); background: var(--soft); border-radius: 99px; padding: 2px 8px; flex: none; }
.media { display: block; width: 100%; aspect-ratio: 1 / 1; object-fit: cover; background: var(--soft); max-width: 100%; }
.post-b { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 8px; }
.post-b h2 { font-size: 21px; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); }
.acts { display: flex; align-items: center; gap: 4px; margin-left: -8px; }
.ic { display: inline-flex; align-items: center; gap: 6px; padding: 8px; border-radius: 10px; font-size: 14px; color: var(--fg); }
.ic svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.ic[aria-pressed="true"].like { color: var(--hot); }
.ic[aria-pressed="true"].like svg { fill: var(--hot); }
.ic[aria-pressed="true"].save { color: var(--accent); }
.ic[aria-pressed="true"].save svg { fill: var(--accent); }
.sp { flex: 1; }
.btn { background: var(--accent); color: var(--accent-fg); font-weight: 600; border-radius: 12px; padding: 10px 16px; }
.btn.ghost { background: var(--soft); color: var(--fg); }
.btn:disabled { opacity: .5; cursor: not-allowed; }

nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--surface); border-top: 1px solid var(--line);
  padding: 6px max(16px, env(safe-area-inset-left, 0px)) calc(6px + env(safe-area-inset-bottom, 0px));
}
nav.tabs .in { max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); align-items: center; }
.tab { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; font-size: 11.5px; color: var(--muted); }
.tab svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tab[aria-current="page"] { color: var(--accent); font-weight: 600; }
.tab.plus span.pl { width: 44px; height: 32px; border-radius: 12px; background: var(--accent); color: var(--accent-fg); display: grid; place-items: center; }
.tab.plus svg { stroke: var(--accent-fg); }

.view-h { margin: 6px 0 14px; display: flex; flex-direction: column; gap: 4px; }
.view-h h1 { font-size: 28px; }
.view-h p { margin: 0; color: var(--muted); }
.empty { border: 1px dashed var(--line); border-radius: 16px; padding: 28px 18px; text-align: center; color: var(--muted); }
.empty b { display: block; color: var(--fg); font-family: var(--f-display); font-size: 18px; margin-bottom: 4px; }

form.new { display: flex; flex-direction: column; gap: 14px; }
label.f { display: flex; flex-direction: column; gap: 6px; font-weight: 600; font-size: 14px; }
label.f small { font-weight: 400; color: var(--muted); }
input[type=text], input[type=number], textarea, select {
  font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; width: 100%; font-weight: 400;
}
textarea { min-height: 112px; resize: vertical; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.drop { position: relative; border: 1.5px dashed var(--line); border-radius: 16px; aspect-ratio: 4 / 3; max-width: 100%; display: grid; place-items: center; text-align: center; color: var(--muted); background: var(--surface); overflow: hidden; cursor: pointer; }
.drop input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
.drop img, .drop video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.drop b { display: block; color: var(--fg); font-family: var(--f-display); font-size: 17px; }

.servbox { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px 12px; background: var(--soft); border-radius: 14px; padding: 8px 10px 8px 14px; margin-bottom: 10px; }
.servbox .sl { font-weight: 600; }
.stepper { display: flex; align-items: center; gap: 6px; }
.stepper .rm { background: var(--surface); font-size: 22px; line-height: 1; color: var(--fg); }
#servin { width: 64px; text-align: center; font-weight: 600; padding: 9px 4px; }
.reset { color: var(--accent); font-weight: 600; font-size: 13px; padding: 6px 4px; }
.hint { margin: 8px 2px 0; font-size: 13px; color: var(--muted); }
.hint:empty { display: none; }
.nutri { display: grid; grid-template-columns: 1.25fr 1fr 1fr 1fr; gap: 8px; }
.nutri > div { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 4px; text-align: center; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.nutri b { font-family: var(--f-display); font-size: 18px; font-variant-numeric: tabular-nums; }
.nutri span { font-size: 11.5px; color: var(--muted); }
.nutri .kc { background: var(--accent); border-color: var(--accent); }
.nutri .kc b, .nutri .kc span { color: var(--accent-fg); }
.slist { display: flex; flex-direction: column; gap: 10px; }
.srow { cursor: pointer; display: grid; grid-template-columns: 88px minmax(0, 1fr) auto; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 8px; }
.sthumb { width: 88px; height: 88px; border-radius: 12px; overflow: hidden; padding: 0; background: var(--soft); }
.sthumb img, .sthumb video { width: 100%; height: 100%; object-fit: cover; display: block; }
.sinfo { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.sinfo b { font-family: var(--f-display); font-size: 17px; line-height: 1.2; }
.sinfo span { font-size: 13px; color: var(--muted); }
.sheetmedia .media { aspect-ratio: 4 / 3; border-radius: 16px; }
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--soft); border-radius: 12px; padding: 4px; gap: 4px; margin-bottom: 12px; }
.seg button { padding: 9px; border-radius: 9px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgba(60, 30, 10, .12); }
.weeknav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; font-family: var(--f-display); font-size: 18px; }
.weeknav .ic { font-size: 26px; line-height: 1; padding: 4px 14px; font-family: var(--f-body); }
.days { display: flex; flex-direction: column; gap: 12px; }
.day { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.dayh { display: flex; align-items: center; justify-content: space-between; font-family: var(--f-display); font-size: 17px; }
.carousel { display: flex; gap: 8px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; overscroll-behavior-x: contain; }
.carousel::-webkit-scrollbar { display: none; }
.carousel .meal { flex: 0 0 100%; min-width: 0; scroll-snap-align: start; }
.carousel.multi .meal { flex-basis: 86%; }
.meal.off { background: transparent; box-shadow: inset 0 0 0 1.5px var(--line); }
.meal.off .mthumb, .meal.off .mmid { opacity: .6; }
.mchk { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--fg); text-align: left; padding: 6px 2px 2px; border-top: 1px solid var(--line); }
.mchk[aria-checked="true"] .box { background: var(--accent); border-color: var(--accent); }
.addmore { align-self: flex-start; color: var(--accent); font-weight: 600; font-size: 13px; padding: 2px 0; }
.pc { border: 1px solid var(--line); border-radius: 99px; padding: 4px 12px; font-size: 13px; background: var(--surface); color: var(--fg); }
.pc[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.pchips { display: flex; flex-wrap: wrap; gap: 6px; }
.mwho { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); padding-top: 2px; }
.peoplebar { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 14px; color: var(--muted); margin-bottom: 12px; }
.peoplebar b { color: var(--fg); font-weight: 600; }
.prow { display: flex; gap: 8px; align-items: center; }
.prow .pn { flex: 1; min-width: 0; }
.mk { font-size: 12px; color: var(--muted); }
.daynut { border-top: 1px solid var(--line); padding-top: 10px; display: flex; flex-direction: column; gap: 8px; }
.dnh { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-weight: 600; font-size: 14px; }
.dnh small { font-weight: 400; color: var(--muted); font-size: 12px; text-align: right; }
.nutri.sm b { font-size: 16px; }
.nutri.sm > div { padding: 8px 4px; }
.slots { display: flex; flex-direction: column; gap: 10px; }
.slot { display: flex; flex-direction: column; gap: 6px; border-radius: 12px; }
.slot.dragging { position: relative; z-index: 5; background: var(--surface); box-shadow: 0 10px 28px rgba(60, 30, 10, .22); }
.slh { display: flex; align-items: center; justify-content: space-between; min-height: 28px; }
.grip { width: 44px; height: 28px; display: grid; place-items: center; color: var(--muted); touch-action: none; cursor: grab; border-radius: 8px; }
.grip svg { width: 18px; height: 18px; fill: currentColor; }
.slot.dragging .grip { cursor: grabbing; color: var(--accent); }
.sln { font-size: 13px; color: var(--muted); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.addwrap { display: flex; align-items: center; gap: 6px; min-width: 0; }
.addwrap .addslot { flex: 1; min-width: 0; }
.addmoment { align-self: flex-start; color: var(--accent); font-weight: 600; font-size: 14px; padding: 4px 0; }
.addslot { border: 1.5px dashed var(--line); border-radius: 12px; padding: 12px; color: var(--muted); text-align: left; width: 100%; }
.meal { display: grid; grid-template-columns: 48px minmax(0, 1fr) 32px; gap: 10px; align-items: center; background: var(--soft); border-radius: 12px; padding: 6px; }
.mthumb { cursor: pointer; width: 48px; height: 48px; border-radius: 9px; overflow: hidden; }
.mthumb img, .mthumb video { width: 100%; height: 100%; object-fit: cover; display: block; }
.mmid { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.mtitle { text-align: left; font-weight: 600; line-height: 1.25; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.mser { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.mb { width: 26px; height: 26px; border-radius: 50%; background: var(--surface); color: var(--fg); font-size: 16px; line-height: 1; display: grid; place-items: center; }
.mx { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); }
.mx svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
.shopact { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
.shopact .btn { padding: 8px 14px; font-size: 14px; }
.shc { font-size: 16px; margin: 16px 0 8px; }
.shgroup { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.shrow { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 14px; text-align: left; border-bottom: 1px solid var(--line); }
.shrow:last-child { border-bottom: 0; }
.box { width: 22px; height: 22px; border-radius: 7px; border: 1.8px solid var(--muted); flex: none; display: grid; place-items: center; }
.box svg { width: 16px; height: 16px; fill: none; stroke: var(--accent-fg); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.shn { flex: 1; min-width: 0; }
.shq { color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; font-size: 14px; }
.shrow.done .box { background: var(--accent); border-color: var(--accent); }
.shrow.done .shn, .shrow.done .shq { text-decoration: line-through; color: var(--muted); }
.tap { cursor: pointer; display: block; }
.tapb { display: flex; flex-direction: column; gap: 8px; }
.authbtn { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; text-align: left; }
.follow { flex: none; border: 1px solid var(--accent); color: var(--accent); border-radius: 99px; padding: 5px 14px; font-size: 13px; font-weight: 600; }
.follow[aria-pressed="true"] { background: var(--soft); border-color: var(--soft); color: var(--fg); }
.people { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; }
.people h3 { width: 100%; font-size: 17px; }
.people button { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 14px; font-size: 14px; }
.fbox { display: flex; flex-direction: column; gap: 10px; font-weight: 600; font-size: 14px; }
.fbox small { font-weight: 400; color: var(--muted); }
.ingrow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr) 40px; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px; }
.namewrap { grid-column: 1 / -1; display: flex; gap: 8px; }
.namewrap .in-n { flex: 1; min-width: 0; }
.rm.scan { background: var(--soft); color: var(--accent); flex: none; }
.prodline { grid-column: 1 / -1; font-size: 12px; color: var(--accent); font-weight: 500; }
.brand { display: block; font-size: 12px; color: var(--muted); }
.scanbox { display: flex; align-items: center; gap: 12px; border: 1.5px dashed var(--line); border-radius: 16px; padding: 14px; color: var(--muted); font-size: 14px; }
.scanic svg { width: 40px; height: 40px; fill: none; stroke: var(--accent); stroke-width: 1.6; stroke-linecap: round; flex: none; }
.prodcard { display: flex; flex-direction: column; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
.prodcard > div:first-child b { display: block; font-family: var(--f-display); font-size: 19px; }
.prodcard > div:first-child span { font-size: 13px; color: var(--muted); }
.prodcard .hint { margin: 0; }
.rm { width: 40px; height: 40px; border-radius: 10px; background: var(--soft); display: grid; place-items: center; color: var(--muted); }
.rm svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
.steprow { display: grid; grid-template-columns: 28px minmax(0, 1fr) 40px; gap: 8px; align-items: center; }
.steprow .n { width: 28px; height: 28px; border-radius: 50%; background: var(--soft); color: var(--accent); display: grid; place-items: center; font-family: var(--f-display); font-weight: 700; font-size: 14px; }
input:disabled { opacity: .45; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-top: 14px; }
.grid3 button { padding: 0; border-radius: 8px; overflow: hidden; aspect-ratio: 1; }
.grid3 img, .grid3 video { width: 100%; height: 100%; object-fit: cover; display: block; }
.prof { display: flex; gap: 14px; align-items: center; }
.prof .av { width: 64px; height: 64px; font-size: 26px; }
.stats { display: flex; gap: 18px; margin-top: 12px; font-size: 13px; color: var(--muted); }
.statbtn { background: none; border: 0; padding: 0; font: inherit; color: inherit; text-align: left; cursor: pointer; }
.stats b { display: block; color: var(--fg); font-family: var(--f-display); font-size: 20px; }

.sheet-bg { position: fixed; inset: 0; z-index: 40; background: rgba(8, 14, 10, .55); display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--bg); width: 100%; max-width: 560px; max-height: 92%; overflow-y: auto; border-radius: 22px 22px 0 0; padding: 18px max(16px, env(safe-area-inset-left, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 16px; }
.sheet-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.sheet h2 { font-size: 26px; }
.sheet h3 { font-size: 17px; margin-bottom: 8px; }
.x { width: 36px; height: 36px; border-radius: 50%; background: var(--soft); display: grid; place-items: center; flex: none; }
ul.ing { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
ul.ing li { display: flex; justify-content: space-between; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
ul.ing li:last-child { border-bottom: 0; }
ul.ing li span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
ol.steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 10px; }
.cm { display: flex; flex-direction: column; gap: 10px; }
.cm p { margin: 0; }
.cm b { font-weight: 600; }
.cmf { display: flex; gap: 8px; }
.cmf input { flex: 1; min-width: 0; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 99px; font-size: 14px; z-index: 60; max-width: calc(100% - 32px); }
@media (prefers-reduced-motion: no-preference) { .toast { animation: up .2s ease-out; } @keyframes up { from { opacity: 0; transform: translate(-50%, 8px); } } }
input[type=search] { font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; width: 100%; margin-bottom: 10px; }
.filters.sub button { font-size: 13px; padding: 4px 12px; }
.warn { display: inline-block; align-self: flex-start; font-size: 12px; font-weight: 600; color: #B3261E; background: #FDE8E6; border-radius: 99px; padding: 2px 10px; }
.warnt { color: #B3261E; }
.covb { color: var(--accent); font-weight: 600; }
.menu { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; margin-top: 16px; overflow: hidden; }
.mrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 14px; text-align: left; border-bottom: 1px solid var(--line); width: 100%; }
.mrow:last-child { border-bottom: 0; }
.mrow b { display: block; font-weight: 600; }
.mrow small { color: var(--muted); font-size: 13px; }

    el.style.transform = 'translateY(' + (top - el.getBoundingClientRect().top) + 'px)';
  }
  function endDrag() {
    if (!drag) return;
    var ids = Array.prototype.map.call(drag.box.children, function (c) { return c.getAttribute('data-sid'); });
    state.order[drag.dt] = ids; persist(); drag = null; render();
  }
  document.addEventListener('pointerdown', function (e) {
    var g = e.target.closest && e.target.closest('.grip'); if (!g) return;
    var el = g.closest('.slot'); if (!el) return;
    e.preventDefault();
    drag = { el: el, box: el.parentNode, pid: e.pointerId, grab: e.clientY - el.getBoundingClientRect().top, dt: g.getAttribute('data-dt') };
    try { g.setPointerCapture(e.pointerId); } catch (x) {}
    el.classList.add('dragging');
  });
  document.addEventListener('pointermove', function (e) { if (drag && e.pointerId === drag.pid) { e.preventDefault(); moveDrag(e.clientY); } });
  document.addEventListener('pointerup', function (e) { if (drag && e.pointerId === drag.pid) endDrag(); });
  document.addEventListener('pointercancel', function (e) { if (drag && e.pointerId === drag.pid) endDrag(); });
  document.addEventListener('keydown', function (e) {
    var g = e.target.closest && e.target.closest('.grip'); if (!g || (e.key !== 'ArrowUp' && e.key !== 'ArrowDown')) return;
    e.preventDefault();
    var dt = g.getAttribute('data-dt'), id = g.getAttribute('data-s'), ids = daySlots(dt).map(function (s) { return s[0]; }), i = ids.indexOf(id), j = i + (e.key === 'ArrowUp' ? -1 : 1);
    if (i < 0 || j < 0 || j >= ids.length) return;
    ids.splice(i, 1); ids.splice(j, 0, id); state.order[dt] = ids; persist(); render();
    var ng = document.querySelector('.slot[data-sid="' + id + '"] .grip'); if (ng) ng.focus();
  });
  document.addEventListener('input', function (e) {
    if (e.target.id === 'q') { state.q = e.target.value; var fw = document.getElementById('feedwrap'); if (fw) fw.innerHTML = feedHTML(); return; }
    if (e.target.id === 'rnote') { state.rnote[e.target.getAttribute('data-r')] = e.target.value; persist(); return; }
    if (e.target.classList && e.target.classList.contains('pn')) {
      var v = e.target.value.trim(), q = state.people.filter(function (x) { return x.id === e.target.getAttribute('data-pid'); })[0];
      if (q && v) { q.name = v; persist(); }
      return;
    }
    if (e.target.id !== 'servin') return;
    var v = parseInt(e.target.value, 10);
    if (v >= 1 && v <= 50) { state.sheetServ = v; updateScale(); }
  });

  normPlan();
  render();
})();
</script>

</body>
